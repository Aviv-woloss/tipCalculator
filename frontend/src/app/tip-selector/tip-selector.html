<div class="space-y-4">
  <label class="block text-slate-500 text-xs font-semibold tracking-widest uppercase">Select Tip</label>
  
  <div class="grid grid-cols-3 gap-3">
    @for (tip of tipPercentages; track tip) {
      <button 
        (click)="selectTip(tip)"
        [class.bg-white]="selectedTip === tip"
        [class.text-black]="selectedTip === tip"
        [class.border-slate-800]="selectedTip === tip"
        [class.bg-slate-950]="selectedTip !== tip"
        [class.text-slate-400]="selectedTip !== tip"
        [class.border-slate-900]="selectedTip !== tip"
        class="py-4 text-lg font-medium rounded-xl border text-center transition-all duration-150 hover:border-slate-700 active:scale-98">
        {{ tip }}%
      </button>
    }
  </div>
</div>
