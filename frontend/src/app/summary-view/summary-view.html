<div class="flex flex-col justify-between h-full space-y-16 py-2">
  
  <div class="space-y-8">
    <div class="flex justify-between items-baseline border-b border-slate-900 pb-5">
      <span class="text-slate-500 text-xs uppercase tracking-widest font-semibold">Tip Amount</span>
      <span class="text-3xl font-mono font-medium text-slate-300">${{ tipAmount | number:'1.2-2' }}</span>
    </div>

    <div class="flex justify-between items-baseline pt-4">
      <span class="text-slate-300 text-xs uppercase tracking-widest font-bold">Total / Person</span>
      <span class="text-6xl font-mono font-light text-white tracking-tighter">${{ amountPerPerson | number:'1.2-2' }}</span>
    </div>
  </div>

  <button 
    (click)="save()"
    [disabled]="billAmount === 0"
    [class.opacity-25]="billAmount === 0"
    [class.cursor-not-allowed]="billAmount === 0"
    class="w-full bg-white text-black font-semibold text-xs uppercase tracking-widest py-4 rounded-xl shadow-sm transition-all duration-150 hover:bg-slate-200 active:scale-[0.99]">
    Save to History
  </button>

</div>
